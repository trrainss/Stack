<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Обложка проекта STACKLAB">
  <defs>
    <radialGradient id="sl_glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sl_grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#1c1c1c" stroke-width="1"/>
    </pattern>
    <pattern id="sl_dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#333333"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#090909"/>
  <rect width="1200" height="900" fill="url(#sl_grid)"/>
  <rect width="1200" height="900" fill="url(#sl_glow)"/>

  <!-- Showcase elements -->
  <circle cx="600" cy="450" r="280" fill="none" stroke="#252525" stroke-width="1"/>
  <circle cx="600" cy="450" r="180" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="600" cy="450" r="90" fill="none" stroke="#444444" stroke-width="1.5"/>

  <!-- Badge / Logo Central Box -->
  <g transform="translate(600 450)">
    <rect x="-90" y="-90" width="180" height="180" rx="24" fill="#141414" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <text x="0" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="54" font-weight="700" letter-spacing="-2" fill="#f5f5f5">S<tspan fill="#888888">/</tspan>L</text>
    <text x="0" y="52" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="4" fill="#10b981">LIVE SITE</text>
  </g>

  <!-- Number 01 -->
  <text x="90" y="740" font-family="system-ui, sans-serif" font-size="280" font-weight="800" letter-spacing="-12" fill="#171717">01</text>

  <!-- Top Tags -->
  <text x="90" y="120" font-family="monospace" font-size="14" letter-spacing="4" fill="#10b981">● СОБСТВЕННАЯ РАЗРАБОТКА</text>
  <text x="90" y="170" font-family="system-ui, sans-serif" font-size="38" font-weight="700" letter-spacing="-1" fill="#f5f5f5">STACKLAB SHOWCASE</text>
  <rect x="90" y="195" width="80" height="3" fill="#10b981"/>

  <!-- Footer Info -->
  <text x="1110" y="810" text-anchor="end" font-family="monospace" font-size="14" letter-spacing="3" fill="#888888">NEXT.JS 15 / REACT 19 / TAILWIND</text>
</svg>
