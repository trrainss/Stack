<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Обложка проекта KoreaCar">
  <defs>
    <radialGradient id="kc_glow" cx="65%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="kc_grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#261214" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#0c0708"/>
  <rect width="1200" height="900" fill="url(#kc_grid)"/>
  <rect width="1200" height="900" fill="url(#kc_glow)"/>

  <!-- Compass / Globe / Delivery orbits -->
  <circle cx="780" cy="420" r="220" fill="none" stroke="#2e1417" stroke-width="1"/>
  <circle cx="780" cy="420" r="150" fill="none" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- KoreaCar center badge -->
  <g transform="translate(780 420)">
    <rect x="-80" y="-80" width="160" height="160" rx="20" fill="#1f0e11" stroke="#ef4444" stroke-opacity="0.5" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="40" font-weight="900" fill="#fef2f2">KR</text>
    <text x="0" y="40" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="3" fill="#ef4444">AUTO IMPORT</text>
  </g>

  <!-- Number 04 -->
  <text x="90" y="740" font-family="system-ui, sans-serif" font-size="280" font-weight="800" letter-spacing="-12" fill="#1f0e11">04</text>

  <!-- Title & Category -->
  <text x="90" y="120" font-family="monospace" font-size="14" letter-spacing="4" fill="#ef4444">● КОРПОРАТИВНЫЙ / СЕРВИС</text>
  <text x="90" y="170" font-family="system-ui, sans-serif" font-size="38" font-weight="700" letter-spacing="-1" fill="#fef2f2">KOREACAR</text>
  <rect x="90" y="195" width="80" height="3" fill="#ef4444"/>

  <text x="90" y="240" font-family="system-ui, sans-serif" font-size="18" fill="#fca5a5">Подбор и доставка авто из Кореи: каталог, растаможка, расчёт</text>

  <!-- URL Tag -->
  <rect x="90" y="275" width="260" height="36" rx="6" fill="#1f0e11" stroke="#3b171c"/>
  <text x="110" y="298" font-family="monospace" font-size="12" fill="#ef4444">koreacar-eight.vercel.app</text>

  <text x="1110" y="810" text-anchor="end" font-family="monospace" font-size="14" letter-spacing="3" fill="#991b1b">LIVE PROJECT / 2026</text>
</svg>
